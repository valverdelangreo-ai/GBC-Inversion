name: Construir APK Android
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

      - name: Descargar iconos por defecto
        run: |
          mkdir assets
          curl -sL https://raw.githubusercontent.com/expo/expo/main/templates/expo-template-blank/assets/icon.png -o assets/icon.png
          curl -sL https://raw.githubusercontent.com/expo/expo/main/templates/expo-template-blank/assets/splash.png -o assets/splash.png
          curl -sL https://raw.githubusercontent.com/expo/expo/main/templates/expo-template-blank/assets/adaptive-icon.png -o assets/adaptive-icon.png

      - name: Preparar proyecto Android
        run: npx expo prebuild --platform android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Compilar APK (Versión Producción)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Firmar APK para Android
        working-directory: android
        run: |
          export BUILD_TOOLS_VERSION=$(ls $ANDROID_HOME/build-tools | tail -1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner sign --ks app/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey app/build/outputs/apk/release/app-release-unsigned.apk
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/GBC-Inversion.apk

      - name: Subir APK terminada
        uses: actions/upload-artifact@v4
        with:
          name: GBC-Inversion-APK
          path: android/app/build/outputs/apk/release/GBC-Inversion.apk
          
